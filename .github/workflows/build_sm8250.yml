name: Unica Kernel Build

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Target device codename (x1q , y2q , z3q , c1q , c2q , r8q)"
        required: true
        default: "y2q"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          submodules: recursive   # fetch submodules

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            curl \
            unzip \
            wget \
            zip \
            zstd \
            bc \
            bison \
            flex \
            libssl-dev \
            rsync \
            ccache \
            python3 \
            llvm \
            lld

      - name: Clone Google clang prebuilts
        run: |
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 clang-r547379

      - name: Run kernel build
        run: |
          chmod +x build_sm8250.sh
          ./build_sm8250.sh ${{ github.event.inputs.device }}

      - name: Upload kernel zip
        uses: actions/upload-artifact@v5
        with:
          name: unica-kernel-${{ github.event.inputs.device }}
          path: |
            *.zip
