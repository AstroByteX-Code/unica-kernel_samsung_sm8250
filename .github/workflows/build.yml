name: Unica Kernel Build SM8250-AB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        device: [c1q, c2q, y2q ]

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          submodules: recursive   # fetch submodules

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            curl \
            unzip \
            wget \
            zip \
            zstd \
            bc \
            bison \
            flex \
            libssl-dev \
            rsync \
            ccache \
            python3 \
            llvm \
            lld

      - name: Download latest Google clang
        run: |
          wget -O llvm.tar.zst https://github.com/Ylarod/setup-ndk-clang/releases/download/prebuilt/clang-linux-x86-ndk-r29-r563880c.tar.zst
          mkdir llvm-21; cd llvm-21
          tar -I unzstd -xf ../llvm.tar.zst
          rm ../llvm.tar.zst
          cd ..

      - name: Run kernel build
        run: |
          chmod +x build_sm8250.sh
          ./build_sm8250.sh ${{ matrix.device }}

      - name: Upload kernel zip
        uses: actions/upload-artifact@v5
        with:
          name: unica-kernel-${{ matrix.device }}
          path: |
            *.zip
